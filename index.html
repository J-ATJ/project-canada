<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90e2">
    <title>Project Canada</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="./icons/maple.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <h1>Project Canada</h1>
            <button id="dark-mode-toggle" onclick="toggleDarkMode()">
                <img src="./icons/maple.png" alt="maple">
            </button>
        </nav>
    </header>

    <main id="app-container">
        <!-- LANDING / INICIO -->
        <section id="landing" class="view">
            <div id="daily-card"></div>
            <div class="menu">
                <!-- <button data-target="notas">Notas Rápidas</button> -->
                <button data-target="nivel-1">Nivel 1</button>
                <button data-target="nivel-2">Nivel 2</button>
                <button data-target="nivel-3">Nivel 3</button>
                <button data-target="verbs">Verbos</button>
                <button data-target="grammar">Gramática</button>
            </div>
        </section>

        <!-- NIVEL 1 -->
        <section id="nivel-1" class="view hidden">

            <!-- BLOQUE A: EL MENÚ DE SECCIONES -->
            <div class="submenu-wrapper">
                <button class="btn-back" data-target="landing">Volver</button>
                <div class="menu">
                    <button data-section="pronombres">Pronombres</button>
                    <button data-section="familia">Familia y Conocidos</button>
                    <button data-section="hogar">Hogar</button>
                    <button data-section="cuerpo">Cuerpo Humano</button>
                    <button data-section="animales">Animales</button>
                    <button data-section="expresiones">Expresiones</button>
                    <button data-section="acciones-basicas">Acciones Básicas</button>
                </div>
            </div>

            <!-- BLOQUE B: LA VENTANA DE LAS TARJETAS (Oculta al principio con .hidden) -->
            <div class="words-wrapper hidden">
                <!-- Este botón no vuelve a la landing, vuelve al menú del Nivel 1 -->
                <button class="btn-back btn-back-to-menu">Volver</button>
                <div class="words-display"></div>
            </div>

        </section>


        <!-- NIVEL 2 -->
        <section id="nivel-2" class="view hidden">

            <!-- BLOQUE A: EL MENÚ DE SECCIONES -->
            <div class="submenu-wrapper">
                <button class="btn-back" data-target="landing">Volver</button>
                <div class="menu">
                    <button data-section="lugares">Lugares de la Ciudad</button>
                    <button data-section="transporte">Medios de Transporte</button>
                    <button data-section="naturaleza">Naturaleza</button>
                    <button data-section="alimentos">Alimentos</button>
                    <button data-section="ropa">Ropa</button>
                    <button data-section="descripciones-simples">Descripciones Simples</button>
                </div>
            </div>

            <!-- BLOQUE B: LA VENTANA DE LAS TARJETAS -->
            <div class="words-wrapper hidden">
                <button class="btn-back btn-back-to-menu">Volver</button>
                <div class="words-display"></div>
            </div>

        </section>

        <!-- NIVEL 3 -->
        <section id="nivel-3" class="view hidden">

            <!-- BLOQUE A: EL MENÚ DE SECCIONES -->
            <div class="submenu-wrapper">
                <button class="btn-back" data-target="landing">Volver</button>
                <div class="menu">
                    <button data-section="profesiones">Profesiones</button>
                    <button data-section="emociones">Emociones y Sentimientos</button>
                    <button data-section="tecnologia">Tecnología y Ciencia</button>
                    <button data-section="turismo">Turismo</button>
                    <button data-section="acciones-avanzadas">Acciones avanzadas</button>
                    <button data-section="descripciones-avanzadas">Descripciones avanzadas</button>
                </div>
            </div>

            <!-- BLOQUE B: LA VENTANA DE LAS TARJETAS -->
            <div class="words-wrapper hidden">
                <button class="btn-back btn-back-to-menu">Volver</button>
                <div class="words-display"></div>
            </div>

        </section>


        <!-- VERBS -->
        <section id="verbs" class="view hidden">

            <!-- BLOQUE A: EL MENÚ DE SUB-CATEGORÍAS -->
            <div class="submenu-wrapper">
                <button class="btn-back" data-target="landing">Volver</button>
                <div class="menu">
                    <button data-verb-type="regular">Regular Verbs</button>
                    <button data-verb-type="irregular">Irregular Verbs</button>
                </div>
            </div>

            <!-- BLOQUE B: LA VENTANA DE LAS TARJETAS EXPANSIBLES -->
            <div class="words-wrapper hidden">
                <button class="btn-back btn-back-to-menu">Volver</button>
                <div class="words-display"></div>
            </div>

        </section>


        <!-- SECCIÓN DE GRAMÁTICA -->
        <section id="grammar" class="view hidden">

            <!-- BLOQUE A: EL MENÚ DE TEMAS GRAMATICALES -->
            <div class="submenu-wrapper">
                <button class="btn-back" data-target="landing">Volver</button>
                <div class="menu">
                    <button data-grammar-topic="present-simple">Present Simple</button>
                    <button data-grammar-topic="present-continuous">Present Continuous</button>
                    <button data-grammar-topic="past-simple">Past Simple</button>
                    <button data-grammar-topic="future-will-wont">Future Will/Won't</button>
                    <button data-grammar-topic="present-perfect">Present Perfect</button>
                </div>
            </div>

            <!-- BLOQUE B: LA VENTANA DONDE SE RENDERIZAN LAS NOTAS HTML PURO -->
            <div class="words-wrapper hidden">
                <button class="btn-back btn-back-to-menu">Volver</button>
                <!-- Aquí adentro JavaScript inyectará todo tu texto de apuntes -->
                <div class="words-display"></div>
            </div>

        </section>


    </main>

    <footer></footer>


    <!-- Bases de datos -->
    <script src="js/db.js"></script>
    <script src="js/verbs_db.js"></script>
    <script src="js/grammar_db.js"></script>

    <!-- Luego los controladores de los niveles -->
    <script src="js/nivel1.js"></script>
    <script src="js/nivel2.js"></script>
    <script src="js/nivel3.js"></script>
    <script src="js/verbs.js"></script>
    <script src="js/grammar.js"></script>


    <!-- Archivo principal al final del body -->
    <script src="js/main.js"></script>
</body>

</html>
